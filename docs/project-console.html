<style>
:root {
  --bg: #f6f4ef;

  --ink: #1d1c19;

  --accent: #2f4a3c;
  --warn: #8a4b12;
  --err: #8a1f1f;
  --ok: #1f5c3a;
  --chip: #eef2ea;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "PingFang SC", "Noto Sans SC", sans-serif; }
body { min-height: 100vh; }
a { color: var(--accent); }
.wrap { display: flex; min-height: 100vh; max-width: 1280px; margin: 0 auto; }
aside {
  width: 260px; flex: 0 0 260px; padding: 20px 16px; border-right: 1px solid var(--line);
  background: #fbfaf6; position: sticky; top: 0; height: 100vh; overflow: auto;
}
main { flex: 1 1 auto; min-width: 0; padding: 20px 22px 48px; }
h1 { font-size: 22px; margin: 0 0 8px; }
h2 { font-size: 18px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.nav-page {
  display: block; width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
  border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; color: inherit; cursor: pointer;
}
.nav-page:hover { background: #fff; border-color: var(--line); }
.nav-page.is-on { background: #fff; border-color: var(--accent); }
.nav-page small { display: block; color: var(--muted); font-size: 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
button.ghost, .file-btn {
  background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  font: inherit; font-size: 13px; cursor: pointer; color: var(--ink);
}
button.ghost:hover, .file-btn:hover { border-color: var(--accent); }
.banner { border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 14px; }
.banner.warn { background: #fff6e8; color: var(--warn); border: 1px solid #efd3a8; }
.banner.err { background: #fff1f1; color: var(--err); border: 1px solid #ecc0c0; }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 0 0 12px;
}
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.toggle { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; }
.meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
.details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.hidden { display: none; }
.flow { margin: 8px 0 0; padding: 0; list-style: none; }
.flow li { padding: 8px 0; border-bottom: 1px dashed var(--line); }
.flow li:last-child { border-bottom: 0; }
.chip {
  display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 8px;
  font-size: 12px; margin: 0 6px 6px 0; color: var(--accent);
}
.chip.stale { background: #fff3d6; color: var(--warn); }
.chip.miss { background: #fde8e8; color: var(--err); }
.kv { font-size: 13px; color: var(--muted); }
.path {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  background: #f3f1ea; border-radius: 6px; padding: 2px 6px; word-break: break-all;
}
.copy { margin-left: 6px; font-size: 12px; }
.notes { margin: 0 0 16px; padding-left: 18px; }
.notes li { margin: 0 0 6px; }
.api-link { cursor: pointer; text-decoration: underline; background: none; border: 0; font: inherit; color: var(--accent); padding: 0; }
pre.raw {
  white-space: pre-wrap; word-break: break-word; background: #111; color: #f3efe6;
  border-radius: 8px; padding: 10px; font-size: 12px; overflow: auto; max-height: 240px;
}
@media (max-width: 800px) {
  .wrap { display: block; }
  aside { position: relative; width: auto; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 16px; }
  .nav-page { display: inline-block; width: auto; margin-right: 6px; }
}
</style>
</head>

<script>
(function () {
  const STATUS_LIVE = "源码已核对";
  const STATUS_STALE = "来源已变化待复核";
  const STATUS_MISS = "未找到实现";
  let liveMap = null;
  let view = null;
  let currentPage = null;
  let sample = "live";

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function parseMap(text, label) {
    try {
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.pages) || !Array.isArray(data.features)) {
        throw new Error("缺少 pages/features");
      }
      return data;
    } catch (err) {
      throw new Error((label || "map") + " 解析失败：" + err.message);
    }
  }

  function clone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  function applySample(base, name) {
    if (name === "live" || !base.isolation_samples || !base.isolation_samples[name]) {
      return { map: base, banner: null, kind: "" };
    }
    const fixture = base.isolation_samples[name];
    if (name === "parse_error") {
      try {
        parseMap(fixture.invalid_json, "隔离样例");
        return { map: base, banner: "隔离样例未触发解析失败", kind: "err" };
      } catch (err) {
        return {
          map: null,
          banner: esc(fixture.banner) + "<pre class='raw'>" + esc(fixture.invalid_json) + "</pre><p>" + esc(err.message) + "</p>",
          kind: "err"
        };
      }
    }
    const next = clone(base);
    if (name === "source_changed") {
      const featIds = fixture.stale_feature_ids || [];
      const apiIds = fixture.stale_api_ids || [];
      next.features.forEach(function (f) {
        if (featIds.indexOf(f.id) >= 0) {
          f.implementation_status = STATUS_STALE;
          if (f.algorithm) f.algorithm.implementation_status = STATUS_STALE;
          (f.sources || []).forEach(function (s) {
            if (s.path && s.path.indexOf("manager.py") >= 0) s.fingerprint = fixture.observed_fingerprint;
          });
        }
      });
      next.apis.forEach(function (a) {
        if (apiIds.indexOf(a.id) >= 0) a.implementation_status = STATUS_STALE;
      });
      return { map: next, banner: fixture.banner + " 基线 " + fixture.expected_fingerprint + " → 观察到 " + fixture.observed_fingerprint, kind: "warn" };
    }
    if (name === "source_missing") {
      next.features = next.features.concat([fixture.ghost_feature]);
      const page = next.pages.find(function (p) { return p.id === "page-workbench"; });
      if (page) page.features = page.features.concat([fixture.ghost_feature.id]);
      return { map: next, banner: fixture.banner + " 缺失路径 " + fixture.missing_path, kind: "err" };
    }
    return { map: next, banner: fixture.banner, kind: "warn" };
  }

  function statusChip(status) {
    const cls = status === STATUS_STALE ? " stale" : status === STATUS_MISS ? " miss" : "";
    return "<span class='chip" + cls + "'>" + esc(status || "") + "</span>";
  }

  function sourceList(sources) {
    if (!sources || !sources.length) return "<p class='kv'>无来源</p>";
    return "<ul>" + sources.map(function (s) {
      const path = s.path || "（缺失路径）";
      const fp = s.fingerprint ? " · " + s.fingerprint : " · 无指纹";
      const miss = !s.path || s.fingerprint == null && (s.symbol === "export_pdf");
      return "<li>" + (miss ? statusChip(STATUS_MISS) : "") +
        "<span class='path' data-path='" + esc(path) + "'>" + esc(path) + "</span>" +
        "<button class='ghost copy' type='button' data-copy='" + esc(path) + "'>复制路径</button>" +
        "<span class='kv'> " + esc(s.symbol || "") + fp + " · " + esc(s.checked_at || "") + "</span></li>";
    }).join("") + "</ul>";
  }

  function renderAlgo(algo) {
    if (!algo) return "";
    const params = (algo.parameters || []).map(function (p) {
      return "<li><strong>" + esc(p.key) + "</strong> = " + esc(p.value) +
        " <span class='kv'>(" + esc(p.value_kind) + " · " + esc(p.location) + ")</span><br>" + esc(p.impact) + "</li>";
    }).join("");
    return "<section><h3>算法</h3>" + statusChip(algo.implementation_status) +
      "<p>" + esc(algo.subject || "") + "</p>" +
      "<ol>" + (algo.steps || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ol>" +
      "<p class='kv'>分支</p><ul>" + (algo.branches || []).map(function (s) { return "<li>" + esc(s) + "</li>"; }).join("") + "</ul>" +
      "<p class='kv'>参数</p><ul>" + params + "</ul>" +
      "<p>" + esc(algo.selection || "") + "</p>" +
      "<p>" + esc(algo.failures || "") + "</p>" +
      sourceList(algo.sources) + "</section>";
  }

  function renderAgent(agent) {
    if (!agent) return "";
    return "<section><h3>工具循环</h3>" +
      "<p>模型：" + esc(agent.model) + "</p>" +
      "<p>提示词：" + esc(agent.prompt) + "</p>" +
      "<p>工具：" + (agent.tools && agent.tools.length ? agent.tools.map(function (t) { return "<span class='chip'>" + esc(t) + "</span>"; }).join("") : "无（不是自由选工具 Agent）") + "</p>" +
      "<p>观察：" + esc(agent.observation) + "</p>" +
      "<p>循环：" + esc(agent.loop) + "</p>" +
      "<p>停止：" + esc(agent.stop) + "</p>" +
      "<p>限制：" + esc(agent.limits) + "</p>" +
      "<p>结果：" + esc(agent.result) + "</p></section>";
  }

  function findApi(id) {
    return (view.apis || []).find(function (a) { return a.id === id; });
  }
  function findMod(id) {
    return (view.modules || []).find(function (m) { return m.id === id; });
  }
  function findFeat(id) {
    return (view.features || []).find(function (f) { return f.id === id; });
  }

  function renderApi(api) {
    if (!api) return "<p class='kv'>接口未找到</p>";
    const req = (api.request || []).map(function (r) {
      if (typeof r === "string") return "<li>" + esc(r) + "</li>";
      return "<li><strong>" + esc(r.name) + "</strong> · " + esc(r.in) + " · " + esc(r.type) + "</li>";
    }).join("");
    return "<article class='card' id='api-" + esc(api.id) + "'>" +
      "<h3>" + esc(api.method) + " " + esc(api.url) + "</h3>" +
      statusChip(api.implementation_status) +
      (api.design_vs_source ? "<p class='kv'>" + esc(api.design_vs_source) + "</p>" : "") +
      "<p>" + esc(api.name) + "</p>" +
      "<p class='kv'>请求</p><ul>" + req + "</ul>" +
      "<p class='kv'>响应</p><p>" + esc(api.response) + "</p>" +
      sourceList(api.sources) + "</article>";
  }

  function renderModule(mod) {
    if (!mod) return "";
    const tools = (mod.tools || []).map(function (t) {
      return "<li><strong>" + esc(t.name) + "</strong> 入：" + esc(t.input) + "；出：" + esc(t.output) + "</li>";
    }).join("");
    return "<article class='card' id='mod-" + esc(mod.id) + "'>" +
      "<h3>" + esc(mod.name) + "</h3>" +
      "<span class='chip'>" + esc(mod.kind) + "</span>" + statusChip(mod.implementation_status) +
      "<p>" + esc(mod.responsibility) + "</p>" +
      "<p class='kv'>输入：" + esc(mod.input) + "</p>" +
      "<p class='kv'>输出：" + esc(mod.output) + "</p>" +
      (tools ? "<ul>" + tools + "</ul>" : "") +
      renderAgent(mod.agent) +
      renderAlgo(mod.algorithm) +
      sourceList(mod.sources) + "</article>";
  }

  function renderFeature(feat) {
    const apis = (feat.api_ids || []).map(function (id) {
      const api = findApi(id);
      const label = api ? api.method + " " + api.url : id;
      return "<button class='api-link' type='button' data-jump='api-" + esc(id) + "'>" + esc(label) + "</button>";
    }).join(" · ");
    const flow = (feat.flow || []).map(function (step) {
      return "<li><strong>" + esc(step.actor) + "</strong> " + esc(step.action) +
        "<div class='kv'>数据：" + esc(step.data) + "；分支：" + esc(step.branch) + "</div></li>";
    }).join("");
    const mods = (feat.api_ids || []).reduce(function (acc, id) {
      const api = findApi(id);
      (api && api.module_ids || []).forEach(function (mid) { if (acc.indexOf(mid) < 0) acc.push(mid); });
      return acc;
    }, []);
    return "<article class='card' id='feat-" + esc(feat.id) + "'>" +
      "<button class='toggle' type='button' data-open='" + esc(feat.id) + "'>" +
      "<div class='card-head'><div><h3>" + esc(feat.name) + "</h3>" +
      "<p class='meta'>触发：" + esc(feat.trigger) + "</p></div>" +
      statusChip(feat.implementation_status) + "</div></button>" +
      "<div class='details hidden' id='open-" + esc(feat.id) + "'>" +
      "<p><strong>输入</strong> " + esc(feat.input) + "</p>" +
      "<p><strong>输出</strong> " + esc(feat.output) + "</p>" +
      "<p class='kv'>流程</p><ol class='flow'>" + flow + "</ol>" +
      "<p class='kv'>接口 " + apis + "</p>" +
      renderAlgo(feat.algorithm) +
      (feat.api_ids || []).map(function (id) { return renderApi(findApi(id)); }).join("") +
      mods.map(function (id) { return renderModule(findMod(id)); }).join("") +
      sourceList(feat.sources) +
      "</div></article>";
  }

  function renderParams() {
    const rows = (view.parameters || []).map(function (p) {
      return "<li><strong>" + esc(p.key) + "</strong> = " + esc(p.value) +
        " <span class='kv'>(" + esc(p.value_kind) + " · " + esc(p.location) + ")</span><br>" + esc(p.impact) + "</li>";
    }).join("");
    return "<article class='card'><h3>配置字段与源码默认值</h3><p class='kv'>不读真实 .env，不展示密钥。</p><ul>" + rows + "</ul></article>";
  }

  function renderPage(page) {
    const feats = (page.features || []).map(findFeat).filter(Boolean);
    document.getElementById("content").innerHTML =
      "<h2>" + esc(page.name) + " <span class='path'>" + esc(page.route) + "</span></h2>" +
      statusChip(page.implementation_status) +
      "<p>" + esc(page.purpose) + "</p>" +
      sourceList(page.sources) +
      feats.map(renderFeature).join("") +
      renderParams();
  }

  function renderNav() {
    const nav = document.getElementById("page-nav");
    nav.innerHTML = view.pages.map(function (p) {
      return "<button class='nav-page" + (currentPage === p.id ? " is-on" : "") + "' type='button' data-page='" + esc(p.id) + "'>" +
        esc(p.name) + "<small>" + esc(p.route) + "</small></button>";
    }).join("");
  }

  function show(base, name) {
    sample = name;
    const result = applySample(base, name);
    const banner = document.getElementById("banner");
    if (result.banner) {
      banner.className = "banner " + (result.kind || "warn");
      banner.innerHTML = result.banner;
    } else {
      banner.className = "";
      banner.innerHTML = "";
    }
    view = result.map;
    if (!view) {
      document.getElementById("page-nav").innerHTML = "";
      document.getElementById("content").innerHTML = "";
      document.getElementById("page-notes").innerHTML = "";
      return;
    }
    document.getElementById("checked-at").textContent = "核对日 " + ((view.project && view.project.checked_at) || "");
    document.getElementById("page-notes").innerHTML =
      "<ul class='notes'>" + ((view.project && view.project.notes) || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul>";
    if (!currentPage || !view.pages.some(function (p) { return p.id === currentPage; })) {
      currentPage = view.pages[0] && view.pages[0].id;
    }
    renderNav();
    const page = view.pages.find(function (p) { return p.id === currentPage; });
    if (page) renderPage(page);
  }

  function copyPath(text) {
    const value = text || "";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(function () {}, function () {
        window.prompt("复制失败，请手选路径", value);
      });
    } else {
      window.prompt("请手选并复制路径", value);
    }
  }

  document.addEventListener("click", function (event) {
    const pageBtn = event.target.closest("[data-page]");
    if (pageBtn && view) {
      currentPage = pageBtn.getAttribute("data-page");
      renderNav();
      renderPage(view.pages.find(function (p) { return p.id === currentPage; }));
      return;
    }
    const openBtn = event.target.closest("[data-open]");
    if (openBtn) {
      const box = document.getElementById("open-" + openBtn.getAttribute("data-open"));
      if (box) box.classList.toggle("hidden");
      return;
    }
    const jump = event.target.closest("[data-jump]");
    if (jump) {
      const id = jump.getAttribute("data-jump");
      const featBtn = jump.closest(".card") && jump.closest(".card").querySelector("[data-open]");
      const box = featBtn && document.getElementById("open-" + featBtn.getAttribute("data-open"));
      if (box) box.classList.remove("hidden");
      const node = document.getElementById(id);
      if (node) node.scrollIntoView({ block: "start" });
      return;
    }
    const copyBtn = event.target.closest("[data-copy]");
    if (copyBtn) {
      copyPath(copyBtn.getAttribute("data-copy"));
      return;
    }
    const sampleBtn = event.target.closest("[data-sample]");
    if (sampleBtn && liveMap) {
      show(liveMap, sampleBtn.getAttribute("data-sample"));
    }
  });

  document.getElementById("btn-reload").addEventListener("click", function () {
    loadFromUrl();
  });
  document.getElementById("file-map").addEventListener("change", function (event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        liveMap = parseMap(String(reader.result), file.name);
        show(liveMap, "live");
      } catch (err) {
        document.getElementById("banner").className = "banner err";
        document.getElementById("banner").textContent = err.message;
        document.getElementById("content").innerHTML = "";
      }
    };
    reader.readAsText(file, "utf-8");
  });

  function bootEmbedded() {
    const text = document.getElementById("embedded-map").textContent;
    liveMap = parseMap(text, "embedded-map");
    show(liveMap, "live");
  }

  function loadFromUrl() {
    fetch("./project-map.json", { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (text) {
        liveMap = parseMap(text, "project-map.json");
        show(liveMap, "live");
      })
      .catch(function (err) {
        if (!liveMap) bootEmbedded();
        const banner = document.getElementById("banner");
        banner.className = "banner warn";
        banner.textContent = "未能重新抓取 project-map.json（" + err.message + "）。已保留当前数据。静态 file:// 请用下方文件选择，或按 README 起本地静态服务。";
      });
  }

  try {
    bootEmbedded();
  } catch (err) {
    document.getElementById("banner").className = "banner err";
    document.getElementById("banner").textContent = err.message;
  }
})();
</script>
</body>
</html>
